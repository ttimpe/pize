<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="display">
        <div class="display-border">
            <canvas id="display-canvas"></canvas>

            <div class="display-labels">
                <span style="width: 155px;">Linie/Kurs</span>
                <span style="width: 80px;">Ziel</span>
                <span style="width: 30px;">R</span>
                <span style="width: 80px;">Haltest.</span>
                <span style="width: 130px;">Abweich.</span>
            </div>

        </div>
    </div>
    
    <div class="function-block">
        <button class="function-button">
            <span class="text">Anz.</span>
        </button>
        <button class="arrow-button">
            <span class="text">⇦</span>
        </button>
        <button class="arrow-button">
            <span class="text">⇑</span>
        </button>
        <button class="arrow-button">
            <span class="text">⇨</span>
        </button>
        <button class="function-button button-blue">
            <span class="text">Ansage<br>Stumm</span>
        </button>
        <button class="function-button button-blue">
            <span class="text">Ansage<br>Aussen</span>
        </button>
        <button class="function-button">
            <span class="text">Anz.</span>
        </button>
        <button class="function-button button-blue">
            <span class="text">Sprech-<br>wunsch</span>
        </button>
        <button class="function-button button-blue">
            <span class="text">Leitst.<br>an<br>Fahrgast</span>
        </button>
        <button class="function-button button-red">
            <span class="text">Unfall</span>
        </button>
        <button class="function-button button-blue">
            <span class="text">Haltest.<br>wiederh.</span>
        </button>
        <button class="function-button button-blue">
            <span class="text">Ansage Innen</span>
        </button>
    </div>
    <div class="number-block">
        <button class="number-button">
            <span class="number">7</span>
            <span class="text">Linie-<br>Kurs</span>
        </button>
            <button class="number-button">
                <span class="number">8</span>
                <span class="text">Route</span>
            </button>
            <button class="number-button">
                <span class="number">9</span>
                <span class="text">Ziel-<br>Sonderz.</span>
            </button>
            <button class="number-button">
                <span class="number">4</span>
                <span class="text">Haltest.<br>Nr.</span>
            </button>
            <button class="number-button">
                <span class="number">5</span>
                <span class="text">Richtung</span>
            </button>
            <button class="number-button">
                <span class="number">6</span>
                <span class="text">Meldung</span></button>
                <button class="number-button">
                    <span class="number">1</span>
                    <span class="text">Beset-<br>zung</span>
                </button>
                <button class="number-button">
                    <span class="number">2</span>
                    <span class="text">Uhrzeit<br>Datum</span>
                </button>
                <button class="number-button">
                    <span class="number">3</span>
                    <span class="text">Nächste<br>Haltest.</span>
                </button>
                    <button class="function-button button-yellow">
                        <span class="text">Löschen</span>
                    </button>
                    <button class="number-button">
                        <span class="number">0</span>
                        <span class="text">Stop</span>
                    </button>
                    <button class="function-button button-yellow">
                        <span class="text">Eingabe<br>Quitt.</span>
                    </button>
    </div>
   
  </main> 
  <script>

</script>

  </script> 
</body>
</html>
