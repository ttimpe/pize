<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTT - Mobile Touch Terminal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mtt-container">
        <!-- Header -->
        <header class="mtt-header">
            <div class="header-left">
                <span class="header-date" id="header-date">Do. 11:30:24</span>
            </div>
            <div class="header-center">
                <span class="header-title" id="header-title">Linie/Kurs Fahrplan</span>
            </div>
            <div class="header-right">
                <div class="status-icons">
                    <span class="status-icon">⚙️</span>
                    <span class="status-icon signal">📶</span>
                    <button class="close-btn">✕</button>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <div class="mtt-main">
            <div class="content-area" id="content-area">
                <div class="view-container" id="view-container">
                    <!-- Trip List View -->
                    <div class="view trip-list-view active" id="trip-list-view">
                        <div class="list-container" id="trip-list">
                            <!-- Will be populated by JavaScript -->
                        </div>
                    </div>

                    <!-- Route Stop List View -->
                    <div class="view route-view" id="route-view">
                        <div class="list-container" id="stop-list">
                            <!-- Will be populated by JavaScript -->
                        </div>
                    </div>

                    <!-- Input View with Numpad -->
                    <div class="view input-view" id="input-view">
                        <div class="input-container">
                            <div class="input-fields">
                                <div class="input-field">
                                    <label>Linie/Kurs</label>
                                    <input type="text" id="line-input" readonly>
                                </div>
                                <div class="input-field">
                                    <label>Ziel</label>
                                    <input type="text" id="dest-input" readonly>
                                </div>
                            </div>
                            <div class="numpad" id="numpad">
                                <button class="numpad-btn" data-key="1">1</button>
                                <button class="numpad-btn" data-key="2">2</button>
                                <button class="numpad-btn" data-key="3">3</button>
                                <button class="numpad-btn" data-key="4">4</button>
                                <button class="numpad-btn" data-key="5">5</button>
                                <button class="numpad-btn" data-key="6">6</button>
                                <button class="numpad-btn" data-key="7">7</button>
                                <button class="numpad-btn" data-key="8">8</button>
                                <button class="numpad-btn" data-key="9">9</button>
                                <button class="numpad-btn backspace" data-key="backspace">←</button>
                                <button class="numpad-btn" data-key="0">0</button>
                                <button class="numpad-btn ok" data-key="ok">OK</button>
                            </div>
                        </div>
                    </div>

                    <!-- Keyboard View -->
                    <div class="view keyboard-view" id="keyboard-view">
                        <div class="keyboard-container">
                            <div class="keyboard-input-field">
                                <input type="text" id="keyboard-input" readonly>
                            </div>
                            <div class="keyboard" id="keyboard">
                                <!-- QWERTZ Layout -->
                                <div class="keyboard-row">
                                    <button class="key" data-key="q">Q</button>
                                    <button class="key" data-key="w">W</button>
                                    <button class="key" data-key="e">E</button>
                                    <button class="key" data-key="r">R</button>
                                    <button class="key" data-key="t">T</button>
                                    <button class="key" data-key="z">Z</button>
                                    <button class="key" data-key="u">U</button>
                                    <button class="key" data-key="i">I</button>
                                    <button class="key" data-key="o">O</button>
                                    <button class="key" data-key="p">P</button>
                                    <button class="key" data-key="ü">Ü</button>
                                </div>
                                <div class="keyboard-row">
                                    <button class="key" data-key="a">A</button>
                                    <button class="key" data-key="s">S</button>
                                    <button class="key" data-key="d">D</button>
                                    <button class="key" data-key="f">F</button>
                                    <button class="key" data-key="g">G</button>
                                    <button class="key" data-key="h">H</button>
                                    <button class="key" data-key="j">J</button>
                                    <button class="key" data-key="k">K</button>
                                    <button class="key" data-key="l">L</button>
                                    <button class="key" data-key="ö">Ö</button>
                                    <button class="key" data-key="ä">Ä</button>
                                </div>
                                <div class="keyboard-row">
                                    <button class="key wide" data-key="shift">⇧</button>
                                    <button class="key" data-key="y">Y</button>
                                    <button class="key" data-key="x">X</button>
                                    <button class="key" data-key="c">C</button>
                                    <button class="key" data-key="v">V</button>
                                    <button class="key" data-key="b">B</button>
                                    <button class="key" data-key="n">N</button>
                                    <button class="key" data-key="m">M</button>
                                    <button class="key" data-key=",\">,</button>
                                    <button class="key" data-key=".">.</button>
                                    <button class="key wide" data-key="backspace">←</button>
                                </div>
                                <div class="keyboard-row">
                                    <button class="key wide" data-key="space">Leertaste</button>
                                    <button class="key wide ok" data-key="ok">OK</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tab Bar at Bottom (View Switching) -->
            <footer class="mtt-footer">
                <div class="tab-bar">
                    <button class="tab-btn active" data-view="trip-list" title="Fahrzeug">
                        <img src="assets/images/vehicle.svg" alt="Fahrzeug" class="tab-btn-icon">
                    </button>
                    <button class="tab-btn" data-view="route" title="Einstellungen">
                        <img src="assets/images/settings.svg" alt="Einstellungen" class="tab-btn-icon">
                    </button>
                    <button class="tab-btn" data-view="input" title="Tab 3">
                        <img src="assets/images/button.svg" alt="Tab 3" class="tab-btn-icon">
                    </button>
                    <button class="tab-btn" data-view="keyboard" title="Kommunikation">
                        <img src="assets/images/communication.svg" alt="Kommunikation" class="tab-btn-icon">
                    </button>
                    <button class="tab-btn" title="Sichtkontrolle">
                        <img src="assets/images/key.svg" alt="Sichtkontrolle" class="tab-btn-icon">
                    </button>
                    <button class="tab-btn" title="Linienverlauf">
                        <img src="assets/images/route.svg" alt="Linienverlauf" class="tab-btn-icon">
                    </button>
                </div>
            </footer>

            <!-- Right Sidebar with Function Buttons -->
            <div class="sidebar-right">
                <img src="assets/images/logo_mobiel.svg" alt="Logo" class="sidebar-logo">
                <button class="sidebar-btn red" title="Alarm">
                    <img src="assets/images/exclamation.svg" alt="Alarm" class="sidebar-btn-icon">
                </button>
                <button class="sidebar-btn yellow" title="Telefon">
                    <img src="assets/images/handset.svg" alt="Telefon" class="sidebar-btn-icon">
                </button>
                <button class="sidebar-btn gray" title="Button">
                    <img src="assets/images/button.svg" alt="Button" class="sidebar-btn-icon">
                </button>
                <button class="sidebar-btn beige" title="PA Innen">
                    <img src="assets/images/pa-inside.svg" alt="PA Innen" class="sidebar-btn-icon">
                </button>
                <button class="sidebar-btn beige" title="PA Außen">
                    <img src="assets/images/pa-outside.svg" alt="PA Außen" class="sidebar-btn-icon">
                </button>
                <button class="sidebar-btn beige" title="Tastatur">
                    <img src="assets/images/key.svg" alt="Tastatur" class="sidebar-btn-icon">
                </button>
                <button class="sidebar-btn beige" title="Abmelden">
                    <span class="sidebar-btn-icon">✕</span>
                </button>
            </div>
        </div>
    </div>

    <script src="mtt.js"></script>
</body>
</html>
